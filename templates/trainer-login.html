<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BlitzLearn - Trainer Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="{{ url_for('static', filename='logo/blitz-logo-dark.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/trainer-login-style.css') }}">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand">
            <img src="{{ url_for('static', filename='logo/blitz-logo-dark.png') }}" alt="BlitzLearn" class="login-logo">
            <div>
                <div class="login-brand-name">BlitzLearn</div>
                <div class="login-brand-tag">Trainer Portal</div>
            </div>
        </div>

        <h1>Trainer Login</h1>
        <p class="login-sub">Sign in to manage learners in your department.</p>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="trainer-username" placeholder="Enter your username" autocomplete="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="trainer-password" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <div class="login-error" id="login-error"></div>

        <button class="login-btn" id="login-btn" onclick="handleTrainerLogin()">Login</button>

        <a class="login-back-link" href="/login">← Back to learner login</a>
    </div>
</div>

<script src="{{ url_for('static', filename='js/trainer-login-script.js') }}">
</script>
</body>
</html>
