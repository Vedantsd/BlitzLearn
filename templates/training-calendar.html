<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlitzLearn - NSSTA Training Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='logo/blitz-logo-dark.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/training-calendar-style.css') }}">
</head>

<body>
<div id="custom-cursor"></div>
<header>
    <div class="header-left">
        <img src="{{ url_for('static', filename='logo/blitz-logo-dark.png') }}" alt="BlitzLearn Logo" class="header-logo" id="header-logo"/>
        <h1 onclick="window.location.href='/dashboard'">BlitzLearn</h1>
    </div>
    <div class="header-actions">
        <div id="user-profile" class="profile-circle" title="View Profile" onclick="goToProfile()">
            <img id="user-photo" src="" alt="" style="display: none; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
            <span id="user-initial" style="font-weight: bold; font-size: 14px;">?</span>
        </div>

        <button class="icon-button" onclick="logout()" title="Logout" style="color: #ef4444; border-color: rgba(239, 68, 68, 0.2);">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </button>

        <button id="theme-toggle" class="icon-button" onclick="toggleTheme()" title="Toggle theme">
            <svg id="theme-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path id="moon-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
        </button>
    </div>
</header>

<div class="tc-main">
    <div class="tc-hero">
        <span class="tc-eyebrow">NSSTA</span>
        <h2>Training Calendar</h2>
        <p>NSSTA TPAC-approved training programmes, by month.</p>
    </div>

    <div class="tc-card">
        <div class="tc-toolbar">
            <button class="tc-nav-btn" onclick="changeMonth(-1)">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <div class="tc-month-label" id="tc-month-label">—</div>
            <button class="tc-nav-btn" onclick="changeMonth(1)">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
        </div>

        <div class="tc-weekday-row">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>

        <div class="tc-grid" id="tc-grid"></div>
    </div>

    <div class="tc-events-card">
        <h3 id="tc-events-title">Trainings this month</h3>
        <div class="tc-events-list" id="tc-events-list">
            <p class="empty-state">Loading calendar...</p>
        </div>
    </div>

    <div class="tc-unscheduled-card">
        <button class="tc-unscheduled-toggle" id="tc-toggle-unscheduled">
            <span>Programmes without confirmed dates</span>
            <svg id="tc-unscheduled-arrow" class="tc-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m6 9 6 6 6-6"/>
            </svg>
        </button>
        <div class="tc-unscheduled-panel" id="tc-unscheduled-panel">
            <div class="tc-unscheduled-list" id="tc-unscheduled-list"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
<script src="{{ url_for('static', filename='js/training-calendar-script.js') }}"></script>
</body>
</html>
