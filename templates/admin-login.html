<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BlitzLearn - Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='logo/blitz-logo-dark.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-login-style.css') }}">
</head>
<body>
<div id="custom-cursor"></div>
<header>
    <div class="header-left">
        <img src="{{ url_for('static', filename='logo/blitz-logo-dark.png') }}" alt="BlitzLearn Logo" class="header-logo"/>
        <h1>BlitzLearn <span class="admin-tag">Admin</span></h1>
    </div>
    <div class="header-actions">
        <button id="theme-toggle" class="icon-button" onclick="toggleTheme()" title="Toggle theme">
            <svg id="theme-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path id="moon-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
        </button>
    </div>
</header>

<div class="admin-login-main">
    <div class="admin-login-card">
        <div class="admin-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="26" height="26">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>
        <h2>Admin Login</h2>
        <p class="admin-login-subtitle">Manage users, performance, and department reports.</p>

        <form id="admin-login-form" onsubmit="return false;">
            <div class="form-group">
                <label for="admin-username">Username</label>
                <input type="text" id="admin-username" placeholder="Admin" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <div class="error-message" id="admin-login-error"></div>
            <button type="button" class="submit-button" id="admin-login-btn" onclick="handleAdminLogin()">Login</button>
        </form>

    </div>
</div>

<script src="{{ url_for('static', filename='js/admin-login-script.js') }}"></script>
</body>
</html>
