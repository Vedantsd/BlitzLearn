<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BlitzLearn - Trainer Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="{{ url_for('static', filename='logo/blitz-logo-dark.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/trainer-dashboard-style.css') }}">
</head>
<body>
<header>
    <div class="header-left">
        <img src="{{ url_for('static', filename='logo/blitz-logo-dark.png') }}" alt="BlitzLearn" class="header-logo">
        <h1>BlitzLearn <span class="header-sub">Trainer</span></h1>
    </div>
    <div class="header-actions">
        <div class="trainer-id-block">
            <span class="trainer-name" id="trainer-name">—</span>
            <span class="trainer-dept-badge" id="trainer-dept">—</span>
        </div>
        <button class="icon-button" onclick="handleTrainerLogout()" title="Logout">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </button>
    </div>
</header>

<div class="trainer-main">
    <div class="trainer-stats">
        <div class="trainer-stat-card"><div class="trainer-stat-num" id="stat-total">—</div><div class="trainer-stat-label">Learners</div></div>
        <div class="trainer-stat-card"><div class="trainer-stat-num" id="stat-assessed">—</div><div class="trainer-stat-label">Assessed</div></div>
        <div class="trainer-stat-card"><div class="trainer-stat-num" id="stat-avg">—</div><div class="trainer-stat-label">Avg Score</div></div>
    </div>

    <div class="trainer-split">
        <div class="trainer-pane trainer-learners-pane">
            <div class="pane-head">
                <h2>Learners</h2>
                <input type="text" id="learner-search" placeholder="Search learners..." oninput="filterLearners()">
            </div>
            <div class="learners-list" id="learners-list">
                <p class="empty-state">Loading learners...</p>
            </div>
        </div>

        <div class="trainer-pane trainer-detail-pane">
            <div id="no-learner-selected" class="empty-state-large">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="40" height="40">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 100-8 4 4 0 000 8z"/>
                </svg>
                <p>Select a learner to view their performance and assign courses.</p>
            </div>

            <div id="learner-detail" class="learner-detail" style="display:none;">
                <div class="learner-detail-header">
                    <div>
                        <h2 id="detail-name">—</h2>
                        <p id="detail-meta">—</p>
                    </div>
                    <div class="detail-score-badge" id="detail-score">—</div>
                </div>

                <div class="detail-section">
                    <h3>Skill Competency</h3>
                    <div id="detail-skills" class="detail-skills-list"></div>
                </div>

                <div class="detail-section">
                    <h3>Test History</h3>
                    <div id="detail-tests" class="detail-tests-list"></div>
                </div>

                <div class="detail-section">
                    <h3>Assign a Course</h3>
                    <div class="course-search-row">
                        <input type="text" id="course-search" placeholder="Search iGOT course catalogue...">
                        <button class="trainer-btn-primary" onclick="searchCourses()">Search</button>
                    </div>
                    <div id="course-results" class="course-results"></div>
                </div>

                <div class="detail-section">
                    <h3>Assigned Courses</h3>
                    <div id="assigned-courses-list" class="assigned-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/trainer-dashboard-script.js') }}"></script>
</body>
</html>
